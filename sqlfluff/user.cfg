# Глобальный пользовательский конфиг sqlfluff. Живёт в репозитории конфига, а
# подхватывается штатным путём через симлинк — на новой машине повторить:
#   ln -sfn ~/.config/nvim/sqlfluff/user.cfg ~/.sqlfluff
# Проектный .sqlfluff в дереве репозитория перекрывает эти значения штатным образом.
[sqlfluff]
# Диалект по умолчанию; nvim-lint передаёт --dialect по b:db и перекрывает его.
dialect = postgres
# Запросы пишутся руками, не через dbt — jinja-шаблонизатор только ломает {} в T-SQL.
templater = raw
# Раскладку держит этот же sqlfluff как formatter (conform: fix --rules layout,capitalisation).
# Выключено: select_targets — колонки остаются в строке, пока влезают в max_line_length;
# регистр идентификаторов/литералов/типов — в T-SQL ProcessingId не должен стать processingid.
max_line_length = 120
exclude_rules = layout.select_targets, capitalisation.identifiers, capitalisation.literals, capitalisation.types, aliasing.forbid, structure.subquery

[sqlfluff:indentation]
indented_joins = false
indented_using_on = true
implicit_indents = allow

# Алиасы в select выравниваются в колонку.
[sqlfluff:layout:type:alias_expression]
spacing_before = align
align_within = select_clause
align_scope = bracketed

# from / join / where / group by / order by — каждый с новой строки.
[sqlfluff:layout:type:from_clause]
keyword_line_position = leading
[sqlfluff:layout:type:join_clause]
keyword_line_position = leading
[sqlfluff:layout:type:where_clause]
keyword_line_position = leading
[sqlfluff:layout:type:groupby_clause]
keyword_line_position = leading
[sqlfluff:layout:type:orderby_clause]
keyword_line_position = leading

[sqlfluff:rules:references.keywords]
ignore_words = name, value, type, key, status, source, target
