# Глобальный пользовательский конфиг sqlfluff. Живёт в репозитории конфига, а
# подхватывается штатным путём через симлинк — на новой машине повторить:
#   ln -sfn ~/.config/nvim/sqlfluff/user.cfg ~/.sqlfluff
# Проектный .sqlfluff в дереве репозитория перекрывает эти значения штатным образом.
[sqlfluff]
# Диалект по умолчанию; nvim-lint передаёт --dialect по b:db и перекрывает его.
dialect = postgres
# Запросы пишутся руками, не через dbt — jinja-шаблонизатор только ломает {} в T-SQL.
templater = raw
# Раскладку держит sql-formatter: layout/capitalisation тут дали бы вечный спор
# двух инструментов на каждое сохранение. Остаются смысловые правила:
# aliasing, ambiguous, convention, references, structure.
exclude_rules = layout, capitalisation, aliasing.forbid, structure.subquery

[sqlfluff:rules:references.keywords]
ignore_words = name, value, type, key, status, source, target
